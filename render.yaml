services:
  - type: web
    name: moltbot-gateway
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install && npm run build && npm run ui:build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PORT
        value: "10000"
    healthCheckPath: /
    autoDeploy: true
